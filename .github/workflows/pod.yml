name: Delete Pod on Push to Master

on:
  push:
    branches:
      - master  # or 'main' if that's your default branch

jobs:
  delete-pod:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "$K8S_CA" | base64 -d > $HOME/.kube/ca.crt

        cat <<EOF > $HOME/.kube/config
        apiVersion: v1
        kind: Config
        clusters:
        - name: cluster
          cluster:
            server: ${K8S_SERVER}
            certificate-authority: $HOME/.kube/ca.crt
        contexts:
        - name: default
          context:
            cluster: cluster
            user: deployer
        current-context: default
        users:
        - name: deployer
          user:
            token: ${K8S_TOKEN}
        EOF
      shell: bash
      env:
        K8S_SERVER: ${{ secrets.K8S_SERVER }}
        K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        K8S_CA: ${{ secrets.K8S_CA }}

    - name: Delete restaurant-landing pod
      run: |
        export KUBECONFIG=$HOME/.kube/config
        kubectl delete pod -l app=restaurant-landing -n default --ignore-not-found=true
      shell: bash
